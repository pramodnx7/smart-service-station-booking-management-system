<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AutoCare secure login for admin and customer dashboard access." />
  <title>AutoCare | Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <main class="login-shell">
    <section class="login-visual" aria-label="AutoCare service dashboard preview">
      <a class="brand" href="index.html" aria-label="AutoCare home">
        <span class="brand__mark">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 28 7v8c0 7.5-4.7 12.6-12 15C8.7 27.6 4 22.5 4 15V7l12-5Z"/><path d="m10 17 4 4 8-10"/></svg>
        </span>
        <span><strong>Auto<span>Care</span></strong><small>Smart Service Station</small></span>
      </a>

      <div class="visual-copy">
        <p class="eyebrow">Secure Dashboard Access</p>
        <h1>Manage bookings, vehicles, invoices and service progress.</h1>
      </div>

    </section>

    <section class="login-panel">
      <div class="login-card">
        <div class="login-card__header">
          <p class="eyebrow">Welcome Back</p>
          <h2 id="login-title">Admin Login</h2>
          <p id="login-copy">Sign in as an admin to manage service station operations.</p>
        </div>

        <div class="role-switch" role="tablist" aria-label="Login role">
          <button class="is-active" type="button" data-role="admin" role="tab" aria-selected="true">
            <span>Admin</span>
            <small>Manager dashboard</small>
          </button>
          <button type="button" data-role="customer" role="tab" aria-selected="false">
            <span>Customer</span>
            <small>Service dashboard</small>
          </button>
          <button type="button" data-role="technician" role="tab" aria-selected="false">
            <span>Technician</span>
            <small>Assigned jobs</small>
          </button>
        </div>

        <form id="login-form" novalidate>
          <label>
            <span>Email Address</span>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="admin@autocare.lk" required />
          </label>
          <label>
            <span>Password</span>
            <div class="password-field">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required />
              <button class="password-toggle" type="button" id="toggle-login-password" aria-pressed="false">Show</button>
            </div>
          </label>

          <div class="form-row">
            <label class="remember"><input name="remember" type="checkbox" /> Remember me</label>
            <button class="link-btn" type="button" id="forgot-password">Forgot password?</button>
          </div>

          <p class="form-status" id="form-status" aria-live="polite"></p>
          <button class="btn btn--yellow" id="login-submit" type="submit">Login as Admin</button>
        </form>

        <section id="signup-panel" hidden>
          <form id="signup-form" novalidate>
            <label>
              <span>Full Name</span>
              <input id="signup-name" name="name" type="text" autocomplete="name" placeholder="New Customer" required />
            </label>
            <label>
              <span>Email Address</span>
              <input id="signup-email" name="email" type="email" autocomplete="email" placeholder="customer@example.com" required />
            </label>
            <label>
              <span>Phone Number</span>
              <input id="signup-phone" name="phone" type="tel" autocomplete="tel" placeholder="+94 77 000 1111" required />
            </label>
            <label>
              <span>Password</span>
              <div class="password-field">
                <input id="signup-password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" required />
                <button class="password-toggle" type="button" id="toggle-signup-password" aria-pressed="false">Show</button>
              </div>
            </label>
            <button class="btn btn--yellow" id="signup-submit" type="submit">Create Account</button>
          </form>
        </section>

        <p class="register-note" id="login-note">New customer? <button type="button" class="link-btn" id="open-signup">Create account</button></p>
        <p class="register-note hidden" id="signup-note">Already registered? <button type="button" class="link-btn" id="open-login">Go to login</button></p>
      </div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
